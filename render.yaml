services:
  - type: web
    name: moi-ngay-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci
    startCommand: npm run start:backend
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
      - key: DATABASE_URL
        sync: false
      - key: NEON_AUTH_BASE_URL
        sync: false
      - key: AI_ENABLED
        value: 'false'
      - key: AI_TOTAL_BUDGET_USD
        value: '0'
