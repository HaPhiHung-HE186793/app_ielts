name: Render Deploy Trigger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  trigger-render:
    name: Trigger Render Deploy
    runs-on: ubuntu-latest
    needs: []
    # Only trigger after CI passes; this workflow runs after ci.yml succeeds
    # via the GitHub Actions dependency mechanism (caller must configure)

    steps:
      - name: Trigger Render Deploy Hook
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
        run: |
          curl -s --fail -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": false}' \
            || echo "Render deploy hook failed or not configured"

      - name: Summary
        run: |
          echo "## Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "Render Deploy Hook: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' && 'triggered' || 'not configured' }}" >> $GITHUB_STEP_SUMMARY
