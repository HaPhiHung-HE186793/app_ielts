name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Lint, typecheck, unit tests ───────────────────────────────────────────
  test:
    name: Lint, Typecheck & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

  # ─── Vercel Build check (no deploy) ────────────────────────────────────────
  build-check:
    name: Vercel Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Vercel Output
        env:
          VITE_NEON_AUTH_URL: ${{ secrets.VITE_NEON_AUTH_URL_CI }}
          RENDER_API_URL: ${{ secrets.RENDER_API_URL_CI }}
        run: npm run build:vercel

      - name: Verify build output exists
        run: |
          if [ ! -f ".vercel/output/config.json" ]; then
            echo "ERROR: .vercel/output/config.json not found — build failed"
            exit 1
          fi
          echo "Build output OK"

  # ─── Security: dependency audit ────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: NPM Audit (high severity)
        run: npm audit --audit-level=high

      - name: Check for secrets in code
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
        continue-on-error: true

  # ─── Production health check (chỉ chạy khi push lên main) ─────────────────
  health-check:
    name: Production Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Chỉ chạy sau khi deploy hoàn tất (push lên main), không chạy với PR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-check]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'

      - name: Wait for Render deploy (60s)
        run: sleep 60

      - name: Check production endpoints
        env:
          RENDER_API_URL: ${{ secrets.RENDER_API_URL_CI }}
        run: node scripts/check-health.js
        continue-on-error: true
